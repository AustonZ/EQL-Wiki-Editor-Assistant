# Machine-readable licensing for this repository (https://reuse.software).
# Everything is MIT unless an annotation below says otherwise; the full texts are in LICENSES/.
version = 1
SPDX-PackageName = "EQL Wiki Editor Assistant"
SPDX-PackageDownloadLocation = "https://github.com/AustonZ/EQL-Wiki-Editor-Assistant"

[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 EQL Wiki Editor Assistant contributors"
SPDX-License-Identifier = "MIT"

# The game's item icon artwork. NOT MIT, and not licensed by this project at all: see the licence file and
# game_assets/README.md.
[[annotations]]
path = "game_assets/item_icons/**"
precedence = "override"
SPDX-FileCopyrightText = "Daybreak Game Company LLC"
SPDX-License-Identifier = "LicenseRef-EverQuest-Item-Icons"

# Screenshots of the game, used as test inputs. NOT MIT: they show the publisher's artwork.
[[annotations]]
path = "samples/*.png"
precedence = "override"
SPDX-FileCopyrightText = "Daybreak Game Company LLC"
SPDX-License-Identifier = "LicenseRef-EverQuest-Screenshots"

# A subset of the ENABLE word list, which its compilers released into the public domain. NOT MIT: see the licence file.
[[annotations]]
path = "src/EQLWikiEditorAssistant.Core/Glyphs/enable-i-l-words.txt"
precedence = "override"
SPDX-FileCopyrightText = "Alan Beale and M. Cooper, compilers of ENABLE"
SPDX-License-Identifier = "LicenseRef-ENABLE-Public-Domain"

# Item pages copied from the EverQuest Legends Wiki as test fixtures. NOT MIT; the wiki names no licence.
[[annotations]]
path = "tests/EQLWikiEditorAssistant.Tests/Wiki/Fixtures/*.txt"
precedence = "override"
SPDX-FileCopyrightText = "EverQuest Legends Wiki contributors"
SPDX-License-Identifier = "LicenseRef-EQL-Wiki-Content"
